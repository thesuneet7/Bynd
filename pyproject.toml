[project]
name = "bynd-company-profile"
version = "0.2.0"
description = "Company profiles: screener/tofler financials + NSE/BSE products/customers extraction"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
company-scrape = "company_scrape.cli:main"
listed-docs = "listed_docs.cli:main"
company-profile = "company_profile.cli:main"
